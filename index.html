<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ねこポイント - 家族で共有</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- 変更点：絶対に動く頑丈なFirebaseの読み込み方（Compat版） -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500;900&display=swap');
        body { font-family: 'Kiwi Maru', serif; }
        .animate-pop { animation: pop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: translate(-50%, -40%) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-[#FFF0F5]">
    <div id="root"></div>

    <!-- type="text/babel" に戻したよ。これで真っ白エラーは起きない -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Firebase Config (まお専用の鍵！) ---
        const firebaseConfig = {
            apiKey: "AIzaSyDXfZKICqr2IEFYaunHkGJ-_KmMuu8LV3M",
            authDomain: "neko-point.firebaseapp.com",
            projectId: "neko-point",
            storageBucket: "neko-point.firebasestorage.app",
            messagingSenderId: "753564778745",
            appId: "1:753564778745:web:e0a0878cc84cb32333e228"
        };
        
        // Firebaseの起動
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- Icons ---
        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, []);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const COLORS = [
            { id: 'pink', bg: 'bg-pink-100', border: 'border-pink-300', text: 'text-pink-500', active: 'bg-pink-400 text-white', inactive: 'text-pink-300 hover:bg-pink-50' },
            { id: 'blue', bg: 'bg-blue-100', border: 'border-blue-300', text: 'text-blue-500', active: 'bg-blue-400 text-white', inactive: 'text-blue-300 hover:bg-blue-50' },
            { id: 'green', bg: 'bg-green-100', border: 'border-green-300', text: 'text-green-500', active: 'bg-green-400 text-white', inactive: 'text-green-300 hover:bg-green-50' },
            { id: 'yellow', bg: 'bg-yellow-100', border: 'border-yellow-300', text: 'text-yellow-600', active: 'bg-yellow-400 text-white', inactive: 'text-yellow-400 hover:bg-yellow-50' },
            { id: 'purple', bg: 'bg-purple-100', border: 'border-purple-300', text: 'text-purple-500', active: 'bg-purple-400 text-white', inactive: 'text-purple-300 hover:bg-purple-50' },
        ];

        // --- カスタムがんばりボタン ---
        const QUICK_ACTIONS = [
            { label: 'ねこトイレ', pt: 30, emoji: '🐈‍⬛' },
            { label: '靴揃え', pt: 5, emoji: '👟' },
            { label: 'コーヒー豆挽き', pt: 50, emoji: '🫘' },
            { label: 'お手伝い', pt: 30, emoji: '💪' },
        ];

        const App = () => {
            const [user, setUser] = useState(null);
            const [isSetupComplete, setIsSetupComplete] = useState(false);
            const [kids, setKids] = useState([
                { id: 'kid1', name: '', emoji: '🐱', colorId: 'pink', points: 0 },
                { id: 'kid2', name: '', emoji: '🐶', colorId: 'blue', points: 0 }
            ]);
            const [activeKidId, setActiveKidId] = useState('kid1');
            const [tasks, setTasks] = useState([]);
            const [history, setHistory] = useState([]);
            
            const [newTaskTitle, setNewTaskTitle] = useState('');
            const [newTaskPoints, setNewTaskPoints] = useState(10);
            const [popText, setPopText] = useState(null);
            const [showHistory, setShowHistory] = useState(false);
            
            const [freePoints, setFreePoints] = useState('');
            const [freeReason, setFreeReason] = useState('');

            // 1. Auth Setup
            useEffect(() => {
                auth.signInAnonymously().catch(err => console.error("Auth Error", err));
                const unsub = auth.onAuthStateChanged(u => setUser(u));
                return () => unsub();
            }, []);

            // 2. Data Sync Setup
            useEffect(() => {
                if (!user) return;

                // プロフィールの同期
                const profilesRef = db.doc('neko_point_app/family_data');
                const unsubProfiles = profilesRef.onSnapshot((snap) => {
                    if (snap.exists) {
                        const data = snap.data();
                        setKids(data.kids || kids);
                        setIsSetupComplete(data.isSetupComplete || false);
                    } else {
                        profilesRef.set({ kids, isSetupComplete: false });
                    }
                }, (err) => console.error(err));

                // ミッションの同期
                const tasksRef = db.collection('neko_point_app/family_data/tasks');
                const unsubTasks = tasksRef.onSnapshot((snap) => {
                    setTasks(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                }, (err) => console.error(err));

                // 履歴の同期
                const historyRef = db.collection('neko_point_app/family_data/history');
                const unsubHistory = historyRef.onSnapshot((snap) => {
                    const logs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setHistory(logs.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0)).slice(0, 50));
                }, (err) => console.error(err));

                return () => {
                    unsubProfiles();
                    unsubTasks();
                    unsubHistory();
                };
            }, [user]);

            const updateCloudKids = async (newKids, setupStatus = isSetupComplete) => {
                if (!user) return;
                await db.doc('neko_point_app/family_data').set({ kids: newKids, isSetupComplete: setupStatus }, { merge: true });
            };

            const addPoints = async (kidId, amount, reason) => {
                if (!user || isNaN(amount) || amount === 0) return;
                
                const kid = kids.find(k => k.id === kidId);
                if (!kid) return;

                setPopText(`${kid.emoji} ${kid.name} ${amount > 0 ? '+' : ''}${amount}pt`);
                setTimeout(() => setPopText(null), 1200);

                const newKids = kids.map(k => k.id === kidId ? { ...k, points: k.points + amount } : k);
                await updateCloudKids(newKids);

                await db.collection('neko_point_app/family_data/history').add({
                    kidName: kid.name,
                    kidEmoji: kid.emoji,
                    amount,
                    reason,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            };

            const handleFinishSetup = async () => {
                const updatedKids = kids.map((kid, i) => ({
                    ...kid,
                    name: kid.name.trim() === '' ? `プレイヤー${i + 1}` : kid.name
                }));
                await updateCloudKids(updatedKids, true);
                setIsSetupComplete(true);
            };

            const completeMission = async (task) => {
                await addPoints(activeKidId, task.points, `ミッション: ${task.title}`);
                await db.doc(`neko_point_app/family_data/tasks/${task.id}`).delete();
            };

            const handleAddMission = async () => {
                if (!newTaskTitle.trim() || !user) return;
                await db.collection('neko_point_app/family_data/tasks').add({
                    title: newTaskTitle,
                    points: Number(newTaskPoints),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                setNewTaskTitle('');
            };

            const handleFreeAdd = () => {
                const pts = Number(freePoints);
                const reason = freeReason.trim() || '特別ボーナス';
                if (!isNaN(pts) && pts !== 0) {
                    addPoints(activeKidId, pts, reason);
                    setFreePoints('');
                    setFreeReason('');
                }
            };

            if (!user) return <div className="h-screen flex items-center justify-center text-pink-400 font-bold">繋いでるにゃ...🐾</div>;

            if (!isSetupComplete) {
                return (
                    <div className="min-h-screen p-6 flex flex-col items-center justify-center">
                        <div className="bg-white p-8 rounded-[2rem] shadow-xl w-full max-w-md">
                            <div className="text-center mb-8">
                                <div className="inline-block bg-pink-100 p-3 rounded-full mb-3 text-pink-500">
                                    <Icon name="cat" size={32} />
                                </div>
                                <h1 className="text-2xl font-black text-gray-800">家族の設定</h1>
                                <p className="text-xs text-gray-400 mt-1">みんなの端末に反映されるにゃ！</p>
                            </div>
                            <div className="space-y-6">
                                {kids.map((kid, index) => (
                                    <div key={kid.id} className="bg-gray-50 p-4 rounded-2xl border border-gray-100">
                                        <div className="flex gap-2 mb-3">
                                            <input type="text" value={kid.emoji} onChange={(e) => setKids(prev => prev.map(k => k.id === kid.id ? {...k, emoji: e.target.value} : k))} className="w-14 text-center text-xl bg-white border border-gray-200 rounded-lg p-2 outline-none focus:border-pink-300" />
                                            <input type="text" placeholder="なまえ" value={kid.name} onChange={(e) => setKids(prev => prev.map(k => k.id === kid.id ? {...k, name: e.target.value} : k))} className="flex-1 bg-white border border-gray-200 rounded-lg px-3 font-bold outline-none focus:border-pink-300" />
                                        </div>
                                        <div className="flex gap-2">
                                            {COLORS.map(c => (
                                                <button key={c.id} onClick={() => setKids(prev => prev.map(k => k.id === kid.id ? {...k, colorId: c.id} : k))} className={`w-8 h-8 rounded-full border-2 ${c.bg} ${kid.colorId === c.id ? 'border-gray-800 scale-110 shadow-sm' : 'border-transparent opacity-50'}`} />
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <button onClick={handleFinishSetup} className="w-full mt-8 bg-gray-800 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-all">共有を開始する！</button>
                        </div>
                    </div>
                );
            }

            const activeKid = kids.find(k => k.id === activeKidId) || kids[0];
            const theme = COLORS.find(c => c.id === activeKid.colorId) || COLORS[0];
            
            const maxPoints = Math.max(...kids.map(k => k.points));
            const leaders = kids.filter(k => k.points === maxPoints && k.points > 0);

            return (
                <div className="min-h-screen bg-gray-50 pb-20">
                    {popText && (
                        <div className="fixed top-1/3 left-1/2 z-50 animate-pop bg-white text-gray-800 font-black text-xl px-8 py-4 rounded-full shadow-2xl border-4 border-white whitespace-nowrap">
                            {popText}
                        </div>
                    )}
                    
                    <header className="bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-20">
                        <div className="flex items-center gap-2 font-black text-gray-800">
                            <Icon name="cat" className="text-pink-400" /> ねこポイント
                        </div>
                        <div className="flex gap-3">
                            <button onClick={() => setShowHistory(true)} className="p-2 text-gray-400 hover:bg-gray-100 rounded-full active:scale-95"><Icon name="history" size={20} /></button>
                            <button onClick={() => setIsSetupComplete(false)} className="p-2 text-gray-400 hover:bg-gray-100 rounded-full active:scale-95"><Icon name="settings" size={20} /></button>
                        </div>
                    </header>

                    <main className="max-w-md mx-auto p-4 space-y-6">
                        
                        <div className="bg-white rounded-[2rem] p-6 shadow-md border-b-4 border-gray-200 flex justify-around relative">
                            {kids.map(k => {
                                const isLeader = leaders.some(l => l.id === k.id);
                                const kidTheme = COLORS.find(c => c.id === k.colorId);
                                return (
                                    <div key={k.id} className={`text-center px-2 flex flex-col items-center relative transition-all duration-300 ${isLeader ? 'scale-105' : 'scale-95 opacity-80'}`}>
                                        {isLeader && <div className="absolute -top-6 text-yellow-400 animate-bounce"><Icon name="crown" size={20} fill="currentColor" /></div>}
                                        <div className="text-3xl mb-1">{k.emoji}</div>
                                        <div className="text-[10px] font-bold text-gray-400 truncate w-16 mb-1">{k.name}</div>
                                        <div className={`text-3xl font-black ${kidTheme.text}`}>{k.points}<span className="text-xs ml-0.5">pt</span></div>
                                    </div>
                                )
                            })}
                        </div>

                        <div className="flex bg-white rounded-xl p-1 shadow-sm border border-gray-100">
                            {kids.map(k => {
                                const kidTheme = COLORS.find(c => c.id === k.colorId);
                                const isActive = activeKidId === k.id;
                                return (
                                    <button key={k.id} onClick={() => setActiveKidId(k.id)} className={`flex-1 py-3 font-bold rounded-lg transition-all text-sm flex items-center justify-center gap-1 ${isActive ? kidTheme.active : kidTheme.inactive}`}>
                                        <span>{k.emoji}</span><span className="truncate max-w-[80px]">{k.name}</span>
                                    </button>
                                )
                            })}
                        </div>

                        <div className="space-y-3">
                            <h2 className="text-xs font-bold text-gray-400 pl-2 uppercase tracking-wider flex items-center gap-1">
                                <Icon name="paw-print" size={14} className={theme.text} /> がんばりボタン
                            </h2>
                            <div className="grid grid-cols-2 gap-3 animate-in fade-in duration-300" key={activeKidId}>
                                {QUICK_ACTIONS.map(b => (
                                    <button key={b.label} onClick={() => addPoints(activeKidId, b.pt, b.label)} className={`bg-white p-4 rounded-2xl border-2 ${theme.border} text-left h-28 flex flex-col justify-between active:scale-95 transition-all shadow-sm hover:shadow-md group`}>
                                        <div className="flex justify-between items-start">
                                            <span className="text-2xl group-hover:scale-110 transition-transform">{b.emoji}</span>
                                            <span className={`font-black text-sm px-2 py-0.5 rounded-lg ${theme.bg} ${theme.text}`}>+{b.pt}</span>
                                        </div>
                                        <span className="font-bold text-gray-700 text-xs truncate">{b.label}</span>
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className={`bg-white rounded-2xl p-4 shadow-sm border border-gray-100 relative overflow-hidden`}>
                             <div className={`absolute top-0 left-0 w-1 h-full ${theme.bg}`}></div>
                             <div className="flex gap-2 items-center">
                                 <input 
                                     type="text" 
                                     className="flex-1 bg-gray-50 rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-gray-200" 
                                     placeholder="その他の理由..." 
                                     value={freeReason} 
                                     onChange={e => setFreeReason(e.target.value)} 
                                 />
                                 <div className="relative">
                                     <input 
                                         type="number" 
                                         className="w-20 bg-gray-50 rounded-lg p-3 pr-6 text-sm text-center font-bold outline-none focus:ring-2 focus:ring-gray-200" 
                                         placeholder="数字"
                                         value={freePoints} 
                                         onChange={e => setFreePoints(e.target.value)} 
                                     />
                                     <span className="absolute right-2 top-1/2 transform -translate-y-1/2 text-[10px] text-gray-400 font-bold">pt</span>
                                 </div>
                                 <button 
                                     onClick={handleFreeAdd}
                                     disabled={!freePoints}
                                     className={`flex-shrink-0 w-12 h-12 rounded-xl flex items-center justify-center text-white active:scale-95 transition-all shadow-sm disabled:opacity-50 ${theme.active}`}
                                 >
                                     <Icon name="plus" size={20} />
                                 </button>
                             </div>
                        </div>

                        <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 space-y-4">
                            <h2 className="font-bold text-gray-700 flex items-center gap-2 border-l-4 border-gray-300 pl-2 text-sm">
                                大人のオーダー
                            </h2>
                            <div className="space-y-2">
                                {tasks.length === 0 && <div className="text-center text-xs text-gray-400 py-6 bg-gray-50 rounded-xl">ミッション受付中にゃ🐾</div>}
                                {tasks.map(t => (
                                    <div key={t.id} className="flex justify-between items-center bg-gray-50 p-3 rounded-xl border border-gray-100">
                                        <div className="overflow-hidden mr-2">
                                            <div className="font-bold text-sm text-gray-700 truncate">{t.title}</div>
                                            <div className="text-xs text-yellow-500 font-black mt-0.5">★ {t.points} pt</div>
                                        </div>
                                        <button onClick={() => completeMission(t)} className={`flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center text-white shadow-md active:scale-90 transition-transform ${theme.active}`}>
                                            <Icon name="check" size={18} />
                                        </button>
                                    </div>
                                ))}
                            </div>
                            
                            <div className="pt-5 border-t border-gray-100 space-y-2 mt-2">
                                <input className="w-full bg-gray-50 rounded-lg p-3 text-sm outline-none border border-transparent focus:border-gray-300" placeholder="窓拭き など..." value={newTaskTitle} onChange={e => setNewTaskTitle(e.target.value)} />
                                <div className="flex gap-2">
                                    <div className="relative">
                                        <input type="number" className="w-24 bg-gray-50 rounded-lg p-3 pr-6 text-sm text-center font-bold outline-none border border-transparent focus:border-gray-300" value={newTaskPoints} onChange={e => setNewTaskPoints(e.target.value)} />
                                        <span className="absolute right-2 top-1/2 transform -translate-y-1/2 text-[10px] text-gray-400 font-bold">pt</span>
                                    </div>
                                    <button onClick={handleAddMission} className="flex-1 bg-gray-800 hover:bg-gray-900 text-white font-bold rounded-lg text-sm active:scale-95 transition-colors shadow-sm">ミッション追加</button>
                                </div>
                            </div>
                        </div>
                    </main>

                    {showHistory && (
                        <div className="fixed inset-0 z-50 bg-black/30 backdrop-blur-sm flex flex-col justify-end">
                            <div className="bg-white rounded-t-[2rem] h-[75vh] flex flex-col overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-300">
                                <div className="p-6 border-b border-gray-100 flex justify-between items-center sticky top-0 bg-white">
                                    <h3 className="font-black text-lg text-gray-800 flex items-center gap-2"><Icon name="history" className="text-gray-400" /> がんばり記録</h3>
                                    <button onClick={() => setShowHistory(false)} className="bg-gray-100 text-gray-500 px-4 py-2 rounded-full font-bold text-xs hover:bg-gray-200 active:scale-95">とじる</button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-2 bg-gray-50/50">
                                    {history.map(h => (
                                        <div key={h.id} className="bg-white p-3.5 rounded-xl shadow-sm border border-gray-50 flex justify-between items-center">
                                            <div className="overflow-hidden pr-2">
                                                <div className="font-bold text-sm text-gray-800 truncate flex items-center gap-1.5">
                                                    <span>{h.kidEmoji}</span> <span>{h.reason}</span>
                                                </div>
                                                <div className="text-[10px] text-gray-400 mt-0.5">
                                                    {h.kidName} • {h.timestamp ? new Date(h.timestamp.seconds * 1000).toLocaleString('ja-JP', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '今'}
                                                </div>
                                            </div>
                                            <div className={`font-black text-lg ${h.amount > 0 ? 'text-pink-500' : 'text-gray-400'} flex-shrink-0 bg-gray-50 px-2 py-1 rounded-lg`}>
                                                {h.amount > 0 ? '+' : ''}{h.amount}
                                            </div>
                                        </div>
                                    ))}
                                    {history.length === 0 && <div className="text-center text-gray-400 py-10 text-sm font-bold">まだ記録がないにゃ🐾</div>}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
