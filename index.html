<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ねこポイント - 子供のお小遣い管理</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel for Single File usage -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500;900&display=swap');
        body { font-family: 'Kiwi Maru', serif; }
        .animate-pop { animation: pop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: translate(-50%, -40%) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    </style>
</head>
<body class="bg-[#FFF0F5]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons as Components ---
        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, []);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const COLORS = [
            { id: 'pink', bg: 'bg-pink-100', border: 'border-pink-300', text: 'text-pink-500', active: 'bg-pink-400 text-white', inactive: 'text-pink-300 hover:bg-pink-50' },
            { id: 'blue', bg: 'bg-blue-100', border: 'border-blue-300', text: 'text-blue-500', active: 'bg-blue-400 text-white', inactive: 'text-blue-300 hover:bg-blue-50' },
            { id: 'green', bg: 'bg-green-100', border: 'border-green-300', text: 'text-green-500', active: 'bg-green-400 text-white', inactive: 'text-green-300 hover:bg-green-50' },
            { id: 'yellow', bg: 'bg-yellow-100', border: 'border-yellow-300', text: 'text-yellow-600', active: 'bg-yellow-400 text-white', inactive: 'text-yellow-400 hover:bg-yellow-50' },
            { id: 'purple', bg: 'bg-purple-100', border: 'border-purple-300', text: 'text-purple-500', active: 'bg-purple-400 text-white', inactive: 'text-purple-300 hover:bg-purple-50' },
        ];

        const App = () => {
            const [isSetupComplete, setIsSetupComplete] = useState(false);
            const [kids, setKids] = useState([
                { id: 'kid1', name: '', emoji: '🐱', colorId: 'pink', points: 0 },
                { id: 'kid2', name: '', emoji: '🐶', colorId: 'blue', points: 0 }
            ]);
            const [activeKidId, setActiveKidId] = useState('kid1');
            const [tasks, setTasks] = useState([]);
            const [newTaskTitle, setNewTaskTitle] = useState('');
            const [newTaskPoints, setNewTaskPoints] = useState(10);
            const [popText, setPopText] = useState(null);

            // ローカルストレージに保存する（簡易的な共有なし版。後でFirebaseに戻せるよ）
            useEffect(() => {
                const saved = localStorage.getItem('neko-data');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    setKids(parsed.kids);
                    setTasks(parsed.tasks);
                    setIsSetupComplete(parsed.isSetupComplete);
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('neko-data', JSON.stringify({ kids, tasks, isSetupComplete }));
            }, [kids, tasks, isSetupComplete]);

            const addPoints = (kidId, amount, reason) => {
                const kid = kids.find(k => k.id === kidId);
                setPopText(`${kid.emoji} ${kid.name} +${amount}pt`);
                setTimeout(() => setPopText(null), 1200);

                setKids(prev => prev.map(k => k.id === kidId ? { ...k, points: k.points + amount } : k));
            };

            const handleFinishSetup = () => {
                const updatedKids = kids.map((kid, i) => ({
                    ...kid,
                    name: kid.name.trim() === '' ? `プレイヤー${i + 1}` : kid.name
                }));
                setKids(updatedKids);
                setIsSetupComplete(true);
            };

            const completeMission = (task) => {
                addPoints(activeKidId, task.points, `ミッション達成: ${task.title}`);
                setTasks(prev => prev.filter(t => t.id !== task.id));
            };

            if (!isSetupComplete) {
                return (
                    <div className="min-h-screen p-6 flex flex-col items-center justify-center">
                        <div className="bg-white p-8 rounded-[2rem] shadow-xl w-full max-w-md">
                            <div className="text-center mb-8">
                                <div className="inline-block bg-pink-100 p-3 rounded-full mb-3 text-pink-500">
                                    <Icon name="cat" size={32} />
                                </div>
                                <h1 className="text-2xl font-black text-gray-800">プロフィールのせってい</h1>
                            </div>
                            <div className="space-y-6">
                                {kids.map((kid, index) => (
                                    <div key={kid.id} className="bg-gray-50 p-4 rounded-2xl border border-gray-100">
                                        <div className="flex gap-2 mb-3">
                                            <input type="text" value={kid.emoji} onChange={(e) => setKids(prev => prev.map(k => k.id === kid.id ? {...k, emoji: e.target.value} : k))} className="w-12 text-center text-xl bg-white border border-gray-200 rounded-lg p-2" />
                                            <input type="text" placeholder="なまえ" value={kid.name} onChange={(e) => setKids(prev => prev.map(k => k.id === kid.id ? {...k, name: e.target.value} : k))} className="flex-1 bg-white border border-gray-200 rounded-lg px-3 font-bold" />
                                        </div>
                                        <div className="flex gap-2">
                                            {COLORS.map(c => (
                                                <button key={c.id} onClick={() => setKids(prev => prev.map(k => k.id === kid.id ? {...k, colorId: c.id} : k))} className={`w-8 h-8 rounded-full border-2 ${c.bg} ${kid.colorId === c.id ? 'border-gray-800' : 'border-transparent'}`} />
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <button onClick={handleFinishSetup} className="w-full mt-8 bg-gray-800 text-white font-bold py-4 rounded-xl shadow-lg">はじめる！</button>
                        </div>
                    </div>
                );
            }

            const activeKid = kids.find(k => k.id === activeKidId);
            const theme = COLORS.find(c => c.id === activeKid.colorId);

            return (
                <div className="min-h-screen bg-gray-50 pb-20">
                    {popText && (
                        <div className="fixed top-1/3 left-1/2 z-50 animate-pop bg-white text-gray-800 font-black text-xl px-6 py-3 rounded-full shadow-2xl border-4 border-pink-400">
                            {popText}
                        </div>
                    )}
                    <header className="bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-20">
                        <div className="flex items-center gap-2 font-black text-gray-800">
                            <Icon name="cat" className="text-pink-400" /> ねこポイント
                        </div>
                        <button onClick={() => setIsSetupComplete(false)} className="text-gray-400"><Icon name="settings" /></button>
                    </header>
                    <main className="max-w-md mx-auto p-4 space-y-6">
                        <div className="bg-white rounded-[2rem] p-6 shadow-md border-b-4 border-gray-200 flex justify-around">
                            {kids.map(k => (
                                <div key={k.id} className="text-center">
                                    <div className="text-2xl">{k.emoji}</div>
                                    <div className="text-xs font-bold text-gray-500">{k.name}</div>
                                    <div className={`text-2xl font-black ${COLORS.find(c => c.id === k.colorId).text}`}>{k.points}pt</div>
                                </div>
                            ))}
                        </div>
                        <div className="flex bg-white rounded-xl p-1 shadow-sm">
                            {kids.map(k => (
                                <button key={k.id} onClick={() => setActiveKidId(k.id)} className={`flex-1 py-2 font-bold rounded-lg transition-all ${activeKidId === k.id ? COLORS.find(c => c.id === k.colorId).active : 'text-gray-400'}`}>
                                    {k.name}
                                </button>
                            ))}
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            {[{l:'お片付け',p:10,e:'🧸'},{l:'靴そろえ',p:5,e:'👟'},{l:'お手伝い',p:15,e:'🍽️'},{l:'宿題',p:20,e:'📝'}].map(b => (
                                <button key={b.l} onClick={() => addPoints(activeKidId, b.p, b.l)} className={`bg-white p-4 rounded-2xl border-2 ${theme.border} text-left h-24 flex flex-col justify-between active:scale-95 transition-all`}>
                                    <span className="text-2xl">{b.e}</span>
                                    <span className="font-bold text-gray-700 text-sm">{b.l} (+{b.p})</span>
                                </button>
                            ))}
                        </div>
                        <div className="bg-white rounded-2xl p-6 shadow-sm space-y-4">
                            <h2 className="font-bold text-gray-700 flex items-center gap-2 border-l-4 border-pink-400 pl-2">ミッション</h2>
                            <div className="space-y-2">
                                {tasks.map(t => (
                                    <div key={t.id} className="flex justify-between items-center bg-gray-50 p-3 rounded-xl">
                                        <div><div className="font-bold text-sm">{t.title}</div><div className="text-xs text-pink-500 font-bold">{t.points}pt</div></div>
                                        <button onClick={() => completeMission(t)} className={`w-10 h-10 rounded-full flex items-center justify-center text-white ${theme.active}`}><Icon name="check" /></button>
                                    </div>
                                ))}
                            </div>
                            <div className="pt-4 border-t border-gray-100 space-y-2">
                                <input className="w-full bg-gray-50 rounded-lg p-3 text-sm outline-none" placeholder="窓拭きなど..." value={newTaskTitle} onChange={e => setNewTaskTitle(e.target.value)} />
                                <div className="flex gap-2">
                                    <input type="number" className="w-20 bg-gray-50 rounded-lg p-3 text-sm text-center font-bold" value={newTaskPoints} onChange={e => setNewTaskPoints(e.target.value)} />
                                    <button onClick={() => {if(newTaskTitle){setTasks([...tasks, {id:Date.now(), title:newTaskTitle, points:Number(newTaskPoints)}]); setNewTaskTitle('');}}} className="flex-1 bg-gray-800 text-white font-bold rounded-lg text-sm">追加</button>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
